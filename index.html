<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>API Connection</title>
    <link rel="shortcut icon" href="logo.png" type="image/x-icon">
</head>

<body class="bg-gray-100 text-gray-800">
    <nav class="bg-white shadow">
        <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex">
                    <div class="flex-shrink-0 flex items-center">
                        <img class="h-8 w-auto" src="logo-white.png" alt="Your Company">
                    </div>
                    <div class="hidden sm:-my-px sm:ml-6 sm:flex sm:space-x-8">
                        <a href="#"
                            class="border-b-2 border-blue-500 text-gray-900 inline-flex items-center px-1 pt-1 text-sm font-medium">Dashboard</a>
                        <a href="#"
                            class="text-gray-600 hover:border-b-2 hover:border-blue-500 inline-flex items-center px-1 pt-1 text-sm font-medium">Team</a>
                        <a href="#"
                            class="text-gray-600 hover:border-b-2 hover:border-blue-500 inline-flex items-center px-1 pt-1 text-sm font-medium">Projects</a>
                        <a href="#"
                            class="text-gray-600 hover:border-b-2 hover:border-blue-500 inline-flex items-center px-1 pt-1 text-sm font-medium">Calendar</a>
                    </div>
                </div>
                <div class="flex items-center">
                    <!-- Notifications -->
                    <button type="button" class="p-1 text-gray-600 hover:text-blue-600 focus:outline-none">
                        <span class="sr-only">View notifications</span>
                        <svg class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75V9a6 6 0 00-12 0v.75a8.967 8.967 0 01-2.312 6.022 23.848 23.848 0 005.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0" />
                        </svg>
                    </button>

                    <!-- Profile dropdown -->
                    <div class="ml-3 relative">
                        <button onclick="handle_user_profile()"
                            class="flex text-sm border-2 border-transparent rounded-full focus:outline-none focus:border-blue-500">
                            <img class="h-8 w-8 rounded-full"
                                src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e" alt="">
                        </button>
                        <div id="user_profile"
                            class="absolute right-0 z-10 mt-2 w-48 origin-top-right rounded-md bg-white shadow-lg ring-1 ring-black ring-opacity-5 invisible"
                            role="menu">
                            <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Your Profile</a>
                            <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Settings</a>
                            <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Sign out</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Mobile menu -->
        <div class="sm:hidden" id="mobile-menu">
            <div class="pt-2 pb-3 space-y-1">
                <a href="#"
                    class="block pl-3 pr-4 py-2 border-l-4 border-blue-500 text-base font-medium text-blue-700 bg-blue-50">Dashboard</a>
                <a href="#" class="block pl-3 pr-4 py-2 text-base font-medium text-gray-700 hover:bg-gray-100">Team</a>
                <a href="#"
                    class="block pl-3 pr-4 py-2 text-base font-medium text-gray-700 hover:bg-gray-100">Projects</a>
                <a href="#"
                    class="block pl-3 pr-4 py-2 text-base font-medium text-gray-700 hover:bg-gray-100">Calendar</a>
            </div>
        </div>
    </nav>

    <!-- User Table -->
    <div class="container mx-auto px-4 my-8">
        <div class="bg-white shadow-md rounded-lg overflow-hidden">
            <div class="p-4 flex justify-end">
                <input type="text" id="table-search-users" placeholder="Search for users"
                    class="border rounded px-3 py-2 w-80">
            </div>
            <table class="min-w-full text-sm text-left text-gray-700">
                <thead class="bg-gray-50 uppercase text-xs font-medium">
                    <tr>
                        <th class="p-4"><input type="checkbox" id="checkbox-all-search"
                                class="w-4 h-4 text-blue-600 rounded border-gray-300 focus:ring-blue-500"></th>
                        <th class="px-6 py-3">Name</th>
                        <th class="px-6 py-3">Phone</th>
                        <th class="px-6 py-3">Status</th>
                        <th class="px-6 py-3">Action</th>
                    </tr>
                </thead>
                <tbody id="userTableBody" class="divide-y divide-gray-100">
                    <!-- Filled by JS -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script>
        $(document).ready(function () {
            $.ajax({
                url: "https://fakestoreapi.com/users",
                dataType: "json",
                type: "GET",
                success: function (response) {
                    populateTable(response);
                },
                error: function (xhr, status, error) {
                    console.log("Error fetching data: ", error);
                }
            });

            function populateTable(users) {
                const tableBody = $('#userTableBody');
                tableBody.empty();
                users.forEach(user => {
                    const row = `
                        <tr class="bg-white hover:bg-gray-50">
                            <td class="p-4">
                                <input type="checkbox" class="w-4 h-4 text-blue-600 rounded border-gray-300">
                            </td>
                            <td class="px-6 py-4">
                                <div class="text-sm font-semibold">${user.username}</div>
                                <div class="text-xs text-gray-500">${user.email}</div>
                            </td>
                            <td class="px-6 py-4">${user.phone}</td>
                            <td class="px-6 py-4">
                                <span class="inline-flex items-center px-2 py-1 text-xs font-medium text-green-800 bg-green-100 rounded">Active</span>
                            </td>
                            <td class="px-6 py-4">
                                <a href="#" class="text-blue-600 hover:underline text-sm">Edit user</a>
                            </td>
                        </tr>
                    `;
                    tableBody.append(row);
                });
            }
        });

        function handle_user_profile() {
            const userProfile = document.getElementById('user_profile');
            userProfile.classList.toggle('invisible');
        }
    </script>
</body>

</html>
